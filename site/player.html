<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DAW Player</title>

    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }

        #track-list {
            margin-bottom: 20px;
        }

        .track-item {
            padding: 10px;
            margin: 5px 0;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid #ddd;
        }

        .track-item:hover {
            background: #e9e9e9;
        }

        #controls {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 15px;
        }

        #seekBar {
            width: 100%;
        }

        #time {
            width: 80px;
            text-align: right;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <h2>DAW Player</h2>

    <div id="track-list"></div>

    <div id="controls">
        <button id="play-pause">▶️</button>
        <input type="range" id="seekBar" min="0" value="0" step="0.01">
        <span id="time">0:00 / 0:00</span>
    </div>

    <audio id="audio"></audio>

    <script src="script.js"></script>
</body>
</html>
