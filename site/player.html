<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>プレイヤー</title>

  <style>
 /* ============================
   全体（黒 × ゴールド）
============================ */
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  margin: 0;
  padding: 0;
  background: #000;
  color: #f5f5f7;
  padding-bottom: 160px;
}

/* ============================
   ヘッダー
============================ */
.header {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  background: #0d0d0d;
  color: #f5f5f7;
  padding: 14px 16px;
  text-align: center;
  font-size: 20px;
  font-weight: 700;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  z-index: 1000;
}

/* ============================
   フッター（中央揃え）
============================ */
.footer {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  background: rgba(10,10,10,0.92);
  padding: 14px 18px;
  border-top: 1px solid rgba(255,255,255,0.08);
  backdrop-filter: blur(18px);
  z-index: 1000;

  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}

.footer-row {
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.footer-left,
.footer-center,
.footer-right {
  display: flex;
  gap: 10px;
  align-items: center;
}

.footer-center {
  justify-content: center;
  flex: 1;
}

/* ============================
   ボタン（iOS風・黒×金）
============================ */
.footer button {
  font-size: 18px;
  padding: 10px 18px;
  border-radius: 999px;
  border: 1px solid rgba(245,196,0,0.4);
  background: #1a1a1a;
  color: #f5f5f7;
  cursor: pointer;
  transition: 0.15s ease;
}

.footer button:hover {
  background: #2a2a2a;
  border-color: rgba(245,196,0,0.9);
}

#play-all {
  background: #f5c400;
  color: #000;
  border-color: #f5c400;
}

/* ============================
   トラックカード
============================ */
.track-card {
  width: 90%;
  background: rgba(20,20,22,0.9);
  padding: 14px 16px;
  margin: 20px auto 10px;
  border-radius: 16px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.7);
  display: flex;
  flex-direction: column;
  gap: 8px;
  border: 1px solid rgba(255,255,255,0.04);
}

.track-card:first-child {
  margin-top: 80px;
}

.track-title {
  font-size: 14px;
  font-weight: 600;
  color: #f5f5f7;
}

/* ============================
   スライダー（進行部分が黄色）
============================ */

/* 共通トラック */
input[type="range"] {
  -webkit-appearance: none;
  width: 100%;
  height: 6px;
  border-radius: 999px;
  background: linear-gradient(
    to right,
    #f5c400 var(--value, 0%),
    #444 var(--value, 0%)
  );
  outline: none;
  position: relative;
}

/* Chrome / Safari */
input[type="range"]::-webkit-slider-runnable-track {
  height: 6px;
  border-radius: 999px;
  background: transparent;
}

/* つまみ */
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: #f5c400;
  border: 2px solid #000;
  margin-top: -6px;
}

/* Firefox */
input[type="range"]::-moz-range-track {
  height: 6px;
  border-radius: 999px;
  background: transparent;
}

input[type="range"]::-moz-range-progress {
  background: #f5c400;
  height: 6px;
  border-radius: 999px;
}

input[type="range"]::-moz-range-thumb {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: #f5c400;
  border: 2px solid #000;
}

/* ============================
   MUTE / SOLO
============================ */
.btn-row button {
  flex: 1;
  padding: 7px 0;
  border-radius: 999px;
  border: 1px solid rgba(255,255,255,0.12);
  background: #1a1a1a;
  color: #f5f5f7;
  font-weight: 600;
  font-size: 12px;
  letter-spacing: 0.04em;
}

.btn-row button.active {
  background: #ff3b30;
  border-color: #ff6b60;
}

.btn-row button.solo-active {
  background: #f5c400;
  color: #000;
  border-color: #f5c400;
}

/* ============================
   シークバー時間
============================ */
.seek-wrapper {
  width: 100%;
  text-align: center;
  color: #d1d1d6;
  font-size: 12px;
}

#seek-bar {
  width: 100%;
  margin-bottom: 4px;
}
  </style>
</head>

<body>

  <div class="header" id="song-title"></div>

  <div id="tracks-container"></div>

  <div class="footer">

    <div class="footer-row">
      <div class="footer-left">
        <button id="rewind">⏪ 10s</button>
      </div>

      <div class="footer-center">
        <button id="play-all">&#9654;</button>
        <button id="stop-all">&#9632;</button>
      </div>

      <div class="footer-right">
        <button id="forward">10s ⏩</button>
      </div>
    </div>

    <div class="seek-wrapper">
      <input type="range" id="seek-bar" value="0" min="0" step="0.1">
      <div>
        <span id="current-time">0:00</span> /
        <span id="duration">0:00</span>
      </div>
    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
