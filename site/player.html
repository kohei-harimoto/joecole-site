<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>プレイヤー</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      background: #000;
      color: #f5f5f7;
      padding-bottom: 180px;
    }

    .header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: #0d0d0d;
      color: #f5f5f7;
      padding: 14px 16px;
      text-align: center;
      font-size: 20px;
      font-weight: 700;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      z-index: 1000;
    }

    /* ▼▼▼ 追加：録音パネル ▼▼▼ */
    #record-panel {
      position: fixed;
      top: 60px; /* header の高さ */
      left: 0;
      width: 100%;
      background: #0d0d0d;
      color: #f5f5f7;
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      z-index: 950;
      box-sizing: border-box;
    }

    #record-panel .bpm-row,
    #record-panel .rec-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 6px;
    }

    #bpm-input {
      width: 80px;
      padding: 6px;
      font-size: 16px;
      background: #1a1a1a;
      border: 1px solid rgba(245,196,0,0.4);
      color: #f5f5f7;
      border-radius: 8px;
    }

    #rec-btn {
      background: #f53b3b;
      color: #fff;
      padding: 8px 16px;
      border-radius: 999px;
      border: none;
      font-size: 14px;
      font-weight: 600;
    }

    #stop-btn {
      background: #444;
      color: #fff;
      padding: 8px 16px;
      border-radius: 999px;
      border: none;
      font-size: 14px;
      font-weight: 600;
    }

    #rec-status {
      font-size: 12px;
      opacity: 0.7;
    }
    /* ▲▲▲ 追加：録音パネル ▲▲▲ */

    /* ▼▼▼ トラックカードの位置調整 ▼▼▼ */
    #tracks-container {
      margin-top: 150px; /* header + record-panel の高さ */
    }
    /* ▲▲▲ */

    .footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(10,10,10,0.92);
      padding: 16px 22px;
      border-top: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(18px);
      z-index: 1000;

      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      box-sizing: border-box;
    }

    .footer-row {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-sizing: border-box;
    }

    .footer-left,
    .footer-center,
    .footer-right {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .footer-center {
      justify-content: center;
      flex: 1;
    }

    .footer button {
      font-size: 16px;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid rgba(245,196,0,0.4);
      background: #1a1a1a;
      color: #f5f5f7;
      cursor: pointer;
      transition: 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
    }

    .footer button:hover {
      background: #2a2a2a;
      border-color: rgba(245,196,0,0.9);
    }

    #play-all {
      background: #f5c400;
      color: #000;
      border-color: #f5c400;
    }

    .track-card {
      width: 90%;
      background: rgba(20,20,22,0.9);
      padding: 14px 16px;
      margin: 20px auto 10px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      display: flex;
      flex-direction: column;
      gap: 8px;
      border: 1px solid rgba(255,255,255,0.04);
    }

    .track-card:first-child {
      margin-top: 80px;
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: linear-gradient(
        to right,
        #f5c400 var(--value, 0%),
        #444 var(--value, 0%)
      );
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #f5c400;
      border: 2px solid #000;
      margin-top: -6px;
    }

    .btn-row {
      display: flex;
      gap: 10px;
    }

    .btn-row button {
      flex: 1;
      padding: 7px 0;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.12);
      background: #1a1a1a;
      color: #f5f5f7;
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 0.04em;
    }

    .btn-row button.active {
      background: #ff3b30;
      border-color: #ff6b60;
    }

    .btn-row button.solo-active {
      background: #f5c400;
      color: #000;
      border-color: #f5c400;
    }

    .seek-wrapper {
      width: 100%;
      text-align: center;
      color: #d1d1d6;
      font-size: 12px;
    }

    #seek-bar {
      width: 100%;
      margin-bottom: 4px;
    }
  </style>
</head>

<body>

  <div class="header" id="song-title"></div>

  <!-- ▼▼▼ 追加：録音UI ▼▼▼ -->
  <div id="record-panel">
    <div class="bpm-row">
      <label>BPM:</label>
      <input id="bpm-input" type="number" value="120">
    </div>

    <div class="rec-row">
      <button id="rec-btn">● REC</button>
      <button id="stop-btn">■ STOP</button>
    </div>

    <div id="rec-status">Status: Stopped</div>
  </div>
  <!-- ▲▲▲ -->

  <div id="tracks-container"></div>

  <div class="footer">

    <div class="footer-row">

      <div class="footer-left">
        <button id="rewind">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="#f5f5f7">
            <polygon points="11,12 20,4 20,20"/>
            <polygon points="4,12 13,4 13,20"/>
          </svg>
          10s
        </button>
      </div>

      <div class="footer-center">
        <button id="play-all">
          <svg id="play-icon" width="22" height="22" viewBox="0 0 24 24" fill="#000">
            <polygon points="6,4 20,12 6,20"/>
          </svg>
        </button>

        <button id="stop-all">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="#f5f5f7">
            <rect x="6" y="6" width="12" height="12"/>
          </svg>
        </button>
      </div>

      <div class="footer-right">
        <button id="forward">
          10s
          <svg width="22" height="22" viewBox="0 0 24 24" fill="#f5f5f7">
            <polygon points="4,4 13,12 4,20"/>
            <polygon points="11,4 20,12 11,20"/>
          </svg>
        </button>
      </div>

    </div>

    <div class="seek-wrapper">
      <input type="range" id="seek-bar" value="0" min="0" step="0.1">
      <div>
        <span id="current-time">0:00</span> /
        <span id="duration">0:00</span>
      </div>
    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
