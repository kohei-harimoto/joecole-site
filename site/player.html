<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>プレイヤー</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      background: #000;
      color: #f5f5f7;
      padding-bottom: 180px;
    }

    .header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: #0d0d0d;
      color: #f5f5f7;
      padding: 14px 16px;
      text-align: center;
      font-size: 20px;
      font-weight: 700;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      z-index: 1000;
    }

    /* ▼▼▼ 録音パネル ▼▼▼ */
    #record-panel {
      position: fixed;
      top: 60px;
      left: 0;
      width: 100%;
      background: #0d0d0d;
      color: #f5f5f7;
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      z-index: 950;
      box-sizing: border-box;
    }

    .record-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    #bpm-input {
      width: 80px;
      padding: 6px;
      font-size: 16px;
      background: #1a1a1a;
      border: 1px solid rgba(245,196,0,0.4);
      color: #f5f5f7;
      border-radius: 8px;
    }

    /* REC（丸・固定） */
    #rec-btn {
      background: #f53b3b;
      color: #fff;
      padding: 8px 16px;
      border-radius: 999px;
      border: 2px solid transparent;
      font-size: 14px;
      font-weight: 600;
      transition: 0.15s ease;
    }

    #rec-btn.rec-on {
      border-color: #f5c400;
      box-shadow: 0 0 10px rgba(245,196,0,0.6);
    }

    /* STOP（丸・固定） */
    #stop-btn {
      background: #444;
      color: #fff;
      padding: 8px 16px;
      border-radius: 999px;
      border: 2px solid transparent;
      font-size: 14px;
      font-weight: 600;
      transition: 0.15s ease;
    }

    #stop-btn.stop-on {
      border-color: #f5c400;
      box-shadow: 0 0 10px rgba(245,196,0,0.6);
    }

    /* ANALYZE（ふわっと表示） */
    #analyze-btn {
      background: #1a1a1a;
      color: #f5f5f7;
      padding: 8px 16px;
      border-radius: 999px;
      border: 2px solid transparent;
      font-size: 14px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    #analyze-btn.analyze-ready {
      opacity: 1;
      pointer-events: auto;
      border-color: #f5c400;
      box-shadow: 0 0 10px rgba(245,196,0,0.6);
    }

    #tracks-container {
      margin-top: 150px;
    }

    /* ▼▼▼ プレイヤーUI ▼▼▼ */

    .footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(10,10,10,0.92);
      padding: 16px 22px;
      border-top: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(18px);
      z-index: 1000;

      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      box-sizing: border-box;
    }

    .footer-row {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-sizing: border-box;
    }

    .footer button {
      font-size: 16px;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid rgba(245,196,0,0.4);
      background: #1a1a1a;
      color: #f5f5f7;
      cursor: pointer;
      transition: 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
    }

    #play-all {
      background: #f5c400;
      color: #000;
      border-color: #f5c400;
    }

    .track-card {
      width: 90%;
      background: rgba(20,20,22,0.9);
      padding: 14px 16px;
      margin: 20px auto 10px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      display: flex;
      flex-direction: column;
      gap: 8px;
      border: 1px solid rgba(255,255,255,0.04);
    }

    /* ▼ シークバーを元の長さに戻す ▼ */
    #seek-bar {
      width: 100% !important;
      height: 6px !important;
      margin-bottom: 4px !important;
      border-radius: 999px !important;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #f5c400;
      border: 2px solid #000;
      margin-top: -6px;
    }

    /* ▼ MUTE / SOLO を完全復元 ▼ */
    .btn-row button {
      background: #1a1a1a !important;
      color: #f5f5f7 !important;
      border: 1px solid rgba(255,255,255,0.12) !important;
      border-radius: 999px !important;

      padding: 8px 0 !important;
      font-size: 13px !important;
      min-height: 36px !important;
      width: 100% !important;

      letter-spacing: 0.04em !important;
      font-weight: 600 !important;
      box-shadow: none !important;
    }

    .btn-row button.active {
      background: #ff3b30 !important;
      border-color: #ff6b60 !important;
    }

    .btn-row button.solo-active {
      background: #f5c400 !important;
      color: #000 !important;
      border-color: #f5c400 !important;
    }

  </style>
</head>

<body>

  <div class="header" id="song-title"></div>

  <!-- ▼ 録音UI ▼ -->
  <div id="record-panel">
    <div class="record-row">
      <label>BPM:</label>
      <input id="bpm-input" type="number" value="120">

      <button id="rec-btn" class="rec-off">● REC</button>
      <button id="stop-btn" class="stop-off">■ STOP</button>

      <button id="analyze-btn" class="analyze-hidden">ANALYZE</button>
    </div>
  </div>

  <div id="tracks-container"></div>

  <!-- ▼ プレイヤーUI ▼ -->
  <div class="footer">
    <div class="footer-row">
      <div class="footer-left">
        <button id="rewind">10s</button>
      </div>

      <div class="footer-center">
        <button id="play-all">
          <svg id="play-icon" width="22" height="22" viewBox="0 0 24 24" fill="#000">
            <polygon points="6,4 20,12 6,20"/>
          </svg>
        </button>

        <button id="stop-all">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="#f5f5f7">
            <rect x="6" y="6" width="12" height="12"/>
          </svg>
        </button>
      </div>

      <div class="footer-right">
        <button id="forward">10s</button>
      </div>
    </div>

    <div class="seek-wrapper">
      <input type="range" id="seek-bar" value="0" min="0" step="0.1">
      <div>
        <span id="current-time">0:00</span> /
        <span id="duration">0:00</span>
      </div>
    </div>
  </div>

  <script src="script.js"></script>

</body>
</html>
