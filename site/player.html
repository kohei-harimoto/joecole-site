<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DAW Player</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
      padding-bottom: 200px;
    }

    /* ---- トラックカード ---- */
    .track-card {
      width: 90%;
      background: #111;
      padding: 12px;
      margin: 12px auto;
      border-radius: 10px;
      border: 1px solid #333;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .track-title {
      font-size: 14px;
      font-weight: 500;
      color: #fff;
    }

    /* ---- 縦フェーダー ---- */
    .fader-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100px;
    }

    .fader-wrapper input[type="range"] {
      width: 100px;
      height: 24px;
      transform: rotate(-90deg);
      accent-color: #ffcc00;
    }

    /* ---- MUTE / SOLO ---- */
    .btn-row {
      display: flex;
      gap: 8px;
    }

    .btn-row button {
      flex: 1;
      padding: 6px 0;
      border-radius: 16px;
      border: 1px solid #444;
      background: #222;
      color: #fff;
      font-size: 12px;
      cursor: pointer;
    }

    .mute.active {
      background: #ff3b30;
      color: #fff;
    }

    .solo.active {
      background: #ffcc00;
      color: #000;
    }

    /* ---- フッター操作部 ---- */
    .footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: #000;
      padding: 12px;
      border-top: 1px solid #333;
      box-sizing: border-box;
    }

    .control-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .control-row button {
      flex: 1;
      margin: 0 4px;
      padding: 10px 0;
      font-size: 20px;
      border-radius: 10px;
      border: 1px solid #444;
      background: #111;
      color: #fff;
      cursor: pointer;
    }

    /* 再生・一時停止アイコン */
    #play-pause {
      background: #ffcc00;
      color: #000;
      font-weight: bold;
    }

    /* ---- A / B / Loop ---- */
    .loop-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .loop-row button {
      flex: 1;
      margin: 0 4px;
      padding: 6px 0;
      font-size: 14px;
      border-radius: 10px;
      border: 1px solid #444;
      background: #111;
      color: #fff;
      cursor: pointer;
    }

    /* Loop ON（黄色＋太枠線） */
    .loop-active {
      background: #ffcc00 !important;
      color: #000 !important;
      border: 3px solid #ffcc00 !important;
      font-weight: bold;
    }

    /* ---- シークバー ---- */
    #seek-bar {
      width: 100%;
      accent-color: #ffcc00;
    }

    #current-time,
    #duration {
      font-size: 12px;
      color: #fff;
    }
  </style>
</head>

<body>

  <div id="tracks-container"></div>

  <div class="footer">

    <!-- 上段：巻き戻し / 再生 / 先送り -->
    <div class="control-row">
      <button id="rewind">⏪</button>
      <button id="play-pause">▶︎</button>
      <button id="forward">⏩</button>
    </div>

    <!-- 停止 -->
    <div class="control-row">
      <button id="stop">■</button>
    </div>

    <!-- A / B / Loop -->
    <div class="loop-row">
      <button id="setA">A</button>
      <button id="setB">B</button>
      <button id="loop">Loop</button>
    </div>

    <!-- シークバー -->
    <input type="range" id="seek-bar" value="0" min="0" step="0.1">
    <div>
      <span id="current-time">0:00</span> /
      <span id="duration">0:00</span>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
