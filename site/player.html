<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>プレイヤー</title>

  <style>
    /* ===============================
       全体
    =============================== */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      background: #000;
      color: #f5f5f7;
      padding-bottom: 180px;
    }

    .header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: #0d0d0d;
      color: #f5f5f7;
      padding: 14px 16px;
      text-align: center;
      font-size: 20px;
      font-weight: 700;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      z-index: 1000;
    }

    /* ===============================
       録音パネル
    =============================== */
    #record-panel {
      position: fixed;
      top: 60px;
      left: 0;
      width: 100%;
      background: #0d0d0d;
      color: #f5f5f7;
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      z-index: 950;
      box-sizing: border-box;
    }

    .record-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    #bpm-input {
      width: 80px;
      padding: 6px;
      font-size: 16px;
      background: #1a1a1a;
      border: 1px solid rgba(245,196,0,0.4);
      color: #f5f5f7;
      border-radius: 8px;
    }

    /* REC */
    #rec-btn {
      background: #f53b3b;
      color: #fff;
      padding: 8px 16px;
      border-radius: 999px;
      border: 2px solid transparent;
      font-size: 14px;
      font-weight: 600;
      transition: 0.15s ease;
    }
    #rec-btn.rec-on {
      border-color: #f5c400;
      box-shadow: 0 0 10px rgba(245,196,0,0.6);
    }

    /* STOP */
    #stop-btn {
      background: #444;
      color: #fff;
      padding: 8px 16px;
      border-radius: 999px;
      border: 2px solid transparent;
      font-size: 14px;
      font-weight: 600;
      transition: 0.15s ease;
    }
    #stop-btn.stop-on {
      border-color: #f5c400;
      box-shadow: 0 0 10px rgba(245,196,0,0.6);
    }

    /* ANALYZE */
    #analyze-btn {
      background: #1a1a1a;
      color: #f5f5f7;
      padding: 8px 16px;
      border-radius: 999px;
      border: 2px solid transparent;
      font-size: 14px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }
    #analyze-btn.analyze-ready {
      opacity: 1;
      pointer-events: auto;
      border-color: #f5c400;
      box-shadow: 0 0 10px rgba(245,196,0,0.6);
    }

    #tracks-container {
      margin-top: 150px;
    }

    /* ===============================
       トラックカード
    =============================== */
    .track-card {
      width: 90%;
      background: rgba(20,20,22,0.9);
      padding: 14px 16px;
      margin: 20px auto 10px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      display: flex;
      flex-direction: column;
      gap: 8px;
      border: 1px solid rgba(255,255,255,0.04);
    }

    /* 音量バー（黄色に戻す） */
    .track-card input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: linear-gradient(
        to right,
        #f5c400 var(--value, 0%),
        #444 var(--value, 0%)
      );
      outline: none;
    }

    .track-card input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #f5c400;
      border: 2px solid #000;
      margin-top: -6px;
    }

    /* MUTE / SOLO（横並び・元のサイズ） */
    .btn-row {
      display: flex;
      gap: 10px;
    }

    .btn-row button {
      flex: 1;
      background: #1a1a1a;
      color: #f5f5f7;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 999px;
      padding: 8px 0;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .btn-row button.active {
      background: #ff3b30;
      border-color: #ff6b60;
    }

    .btn-row button.solo-active {
      background: #f5c400;
      color: #000;
      border-color: #f5c400;
    }

    /* ===============================
       フッター（再生UI）
    =============================== */
    .footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(10,10,10,0.92);
      padding: 16px 22px;
      border-top: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(18px);
      z-index: 1000;

      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      box-sizing: border-box;
    }

    .footer-row {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .footer button {
      font-size: 16px;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid rgba(245,196,0,0.4);
      background: #1a1a1a;
      color: #f5f5f7;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #play-all {
      background: #f5c400;
      color: #000;
      border-color: #f5c400;
    }

    /* シークバー（全幅） */
    #seek-bar {
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: linear-gradient(
        to right,
        #f5c400 var(--value, 0%),
        #444 var(--value, 0%)
      );
    }

    #seek-bar::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #f5c400;
      border: 2px solid #000;
      margin-top: -6px;
    }

  </style>
</head>

<body>

  <div class="header" id="song-title"></div>

  <!-- ▼ 録音UI ▼ -->
  <div id="record-panel">
    <div class="record-row">
      <label>BPM:</label>
      <input id="bpm-input" type="number" value="120">

      <button id="rec-btn">● REC</button>
      <button id="stop-btn">■ STOP</button>
      <button id="analyze-btn" class="analyze-hidden">ANALYZE</button>
    </div>
  </div>

  <div id="tracks-container"></div>

  <!-- ▼ 再生UI ▼ -->
  <div class="footer">
    <div class="footer-row">
      <button id="rewind">10s</button>

      <div class="footer-center">
        <button id="play-all">
          <svg id="play-icon" width="22" height="22" viewBox="0 0 24 24" fill="#000">
            <polygon points="6,4 20,12 6,20"/>
          </svg>
        </button>

        <button id="stop-all">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="#f5f5f7">
            <rect x="6" y="6" width="12" height="12"/>
          </svg>
        </button>
      </div>

      <button id="forward">10s</button>
    </div>

    <div class="seek-wrapper">
      <input type="range" id="seek-bar" value="0" min="0" step="0.1">
      <div>
        <span id="current-time">0:00</span> /
        <span id="duration">0:00</span>
      </div>
    </div>
  </div>

  <script src="script.js"></script>

</body>
</html>
