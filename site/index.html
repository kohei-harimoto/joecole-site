<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>曲一覧</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      background: #000;
      color: #f5f5f7;
      padding-bottom: 40px;
    }

    /* ---- ヘッダー（黒×ゴールドで強調） ---- */
    .header {
      position: sticky;
      top: 0;
      background: linear-gradient(180deg, #1a1a1a 0%, #0d0d0d 100%);
      color: #f5f5f7;
      padding: 18px;
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      border-bottom: 2px solid #f5c400; /* ゴールドライン */
      z-index: 100;
      letter-spacing: 0.03em;
    }

    /* ---- 曲カード ---- */
    .song-card {
      width: 90%;
      background: rgba(20,20,22,0.9);
      padding: 14px 18px;
      margin: 12px auto;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.05);
      cursor: pointer;
      transition: 0.15s ease;
      backdrop-filter: blur(6px);

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .song-card:hover {
      transform: translateY(-2px);
      background: rgba(35,35,38,0.95);
      border-color: rgba(245,196,0,0.4);
      box-shadow: 0 12px 32px rgba(0,0,0,0.8);
    }

    .song-title {
      font-size: 17px;
      font-weight: 600;
      color: #f5f5f7;
      letter-spacing: 0.02em;
    }

    .arrow {
      font-size: 18px;
      color: #f5c400;
      opacity: 0.9;
    }
  </style>
</head>

<body>

  <div class="header">JoeColeの曲一覧</div>

  <div id="song-list"></div>

  <script>
    fetch("tracks/tracks.json")
      .then(res => res.json())
      .then(data => {
        const list = document.getElementById("song-list");

        const songs = Object.keys(data.songs);

        // ============================
        // ソート仕様（あなたの要望通り）
        // 1. 日付付きは新しい順で上
        // 2. 日付なし（原曲など）は下
        // 3. 日付なし同士は tracks.json の順番を維持
        // ============================
        const sorted = songs.sort((a, b) => {
          const dateA = a.match(/^\d{8}/);
          const dateB = b.match(/^\d{8}/);

          // 日付あり同士 → 新しい日付が上
          if (dateA && dateB) {
            return Number(dateB[0]) - Number(dateA[0]);
          }

          // 片方だけ日付あり → 日付ありが上
          if (dateA) return -1;
          if (dateB) return 1;

          // 両方日付なし → tracks.json の順番を維持
          return 0;
        });

        // ============================
        // カード生成
        // ============================
        sorted.forEach(song => {
          const card = document.createElement("div");
          card.className = "song-card";
          card.onclick = () => {
            location.href = `player.html?song=${song}`;
          };

          card.innerHTML = `
            <div class="song-title">${song}</div>
            <div class="arrow">›</div>
          `;

          list.appendChild(card);
        });
      })
      .catch(err => console.error("tracks.json 読み込みエラー:", err));
  </script>

</body>
</html>
