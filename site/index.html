<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>曲一覧</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      background: #000;
      color: #f5f5f7;
      padding-bottom: 40px;
    }

    /* ---- ヘッダー ---- */
    .header {
      position: sticky;
      top: 0;
      background: #0d0d0d;
      color: #f5f5f7;
      padding: 16px;
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      z-index: 100;
    }

    /* ---- 曲カード ---- */
    .song-card {
      width: 90%;
      background: rgba(20,20,22,0.9);
      padding: 14px 18px;
      margin: 12px auto;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.05);
      cursor: pointer;
      transition: 0.15s ease;
      backdrop-filter: blur(6px);

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .song-card:hover {
      transform: translateY(-2px);
      background: rgba(35,35,38,0.95);
      border-color: rgba(245,196,0,0.4);
      box-shadow: 0 12px 32px rgba(0,0,0,0.8);
    }

    .song-title {
      font-size: 17px;
      font-weight: 600;
      color: #f5f5f7;
      letter-spacing: 0.02em;
    }

    /* → アイコン（右側の > ） */
    .arrow {
      font-size: 18px;
      color: #f5c400;
      opacity: 0.9;
    }
  </style>
</head>

<body>

  <div class="header">JoeColeの曲一覧</div>

  <div id="song-list"></div>

  <script>
    fetch("tracks/tracks.json")
      .then(res => res.json())
      .then(data => {
        const list = document.getElementById("song-list");

        Object.keys(data.songs).forEach(song => {
          const card = document.createElement("div");
          card.className = "song-card";
          card.onclick = () => {
            location.href = `player.html?song=${song}`;
          };

          card.innerHTML = `
            <div class="song-title">${song}</div>
            <div class="arrow">›</div>
          `;

          list.appendChild(card);
        });
      })
      .catch(err => console.error("tracks.json 読み込みエラー:", err));
  </script>

</body>
</html>
